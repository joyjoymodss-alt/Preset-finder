<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preset Finder</title>
<style>
  :root { --bg:#0e0b1a; --card:#181428; --line:#2b2545; --text:#f2eefc; --muted:#9a93b8; --a:#8b5cf6; --b:#ec4899; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(circle at top,#2a1650 0,var(--bg) 45%); color:var(--text);
         font-family: system-ui, sans-serif; min-height:100vh; padding:20px 16px 48px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:34px; line-height:1.15; margin:24px 0 8px; }
  h1 span { background:linear-gradient(90deg,#a78bfa,#f472b6); -webkit-background-clip:text; color:transparent; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:16px; }
  label { font-size:14px; display:block; margin-bottom:8px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:#101022; color:var(--text); font-size:16px; }
  button { width:100%; margin-top:12px; padding:14px; border:0; border-radius:14px; color:#fff; font-size:16px; font-weight:600;
           background:linear-gradient(90deg,var(--a),var(--b)); }
  button:disabled { opacity:.6; }
  .status { margin-top:12px; padding:12px; border-radius:12px; font-size:14px; display:none; }
  .ok { background:#10261f; color:#8ff0c4; border:1px solid #1f5a45; display:block; }
  .err { background:#2a1218; color:#ff9aa8; border:1px solid #6b2433; display:block; }
  .video { display:flex; gap:12px; }
  .video img { width:84px; height:112px; object-fit:cover; border-radius:10px; background:#101022; }
  .video b { color:#a78bfa; }
  .video p { margin:4px 0; font-size:14px; word-break:break-word; }
  .preset { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
  .preset:first-of-type { border-top:0; }
  .preset a { background:linear-gradient(90deg,var(--a),var(--b)); color:#fff; text-decoration:none; padding:8px 14px; border-radius:10px; font-size:14px; white-space:nowrap; }
  .tag { font-size:12px; letter-spacing:.1em; color:#a78bfa; text-transform:uppercase; margin-bottom:10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Temukan preset.<br><span>Mulai berkreasi.</span></h1>
  <p class="sub">Tempel tautan video TikTok untuk memeriksa preset Alight Motion yang tersedia.</p>

  <div class="card">
    <div class="tag">Pencarian</div>
    <label for="url">Tautan video</label>
    <input id="url" type="url" placeholder="https://vt.tiktok.com/xxxx/" autocomplete="off">
    <button id="go">Cari preset</button>
    <div id="status" class="status"></div>
  </div>

  <div id="videoCard" class="card hidden">
    <div class="tag">Video ditemukan</div>
    <div class="video">
      <img id="thumb" alt="">
      <div><b id="author"></b><p id="title"></p></div>
    </div>
  </div>

  <div id="presetCard" class="card hidden">
    <div class="tag">Hasil pencarian</div>
    <div id="list"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const status = (msg, cls) => { const s = $('status'); s.textContent = msg; s.className = 'status ' + cls; };

$('go').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) return status('Tempel link TikTok dulu.', 'err');
  $('go').disabled = true; status('Mencari...', 'ok');
  $('videoCard').classList.add('hidden'); $('presetCard').classList.add('hidden');
  try {
    const r = await fetch('/api/preset?url=' + encodeURIComponent(url));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Gagal mencari.');
    $('thumb').src = d.video.thumbnail || '';
    $('author').textContent = '@' + (d.video.author || '');
    $('title').textContent = d.video.title || '';
    $('videoCard').classList.remove('hidden');
    const list = $('list'); list.innerHTML = '';
    d.presets.forEach(p => {
      const row = document.createElement('div'); row.className = 'preset';
      const name = document.createElement('span'); name.textContent = p.name;
      const a = document.createElement('a'); a.href = p.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Buka';
      row.append(name, a); list.append(row);
    });
    if (d.presets.length) $('presetCard').classList.remove('hidden');
    status(d.presets.length ? `Pencarian selesai. Ditemukan ${d.presets.length} preset.` : 'Video ditemukan, tapi belum ada preset yang cocok.', 'ok');
  } catch (e) {
    status(e.message, 'err');
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
